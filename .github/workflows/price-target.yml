name: Price Target Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run report
        run: |
          python run_price_target.py --ticker AAPL --ticker MSFT --ticker BAC --ticker NVDA

      - name: Send status email
        uses: Raghul-M/gmail-sender-action@v1
        with:
          sender_email: ${{ secrets.GMAIL_SENDER }}
          app_password: ${{ secrets.GMAIL_APP_PASSWORD }}
          receiver_emails: ${{ secrets.RECIPIENTS }}
          template_path: templates/email_template.html
          subject: Price Target Report

