name: Price Target Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run report
        run: |
          python run_price_target.py --ticker AAPL --ticker MSFT --ticker BAC --ticker NVDA

      - name: Send email via Mailgun Action
        uses: vineetchoudhary/mailgun-action@master
        with:
          api-key: ${{ secrets.MAILGUN_API_KEY }}
          domain: ${{ secrets.MAILGUN_DOMAIN }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.FROM_EMAIL }}
          subject: Price Target Report
          body: |
            The latest price target report was generated successfully.
            Check the workflow run for details.
