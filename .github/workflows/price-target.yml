name: Price Target Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  run-report:
    runs-on: ubuntu-latest
    env:
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      GITHUB_ACTIONS: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance requests

      - name: Run report
        run: |
          python run_price_target.py --ticker AAPL --ticker MSFT --ticker BAC --ticker NVDA

      - name: Send status email
        uses: dawidd6/action-send-mail@v4
        with:
          server_address: smtp.gmail.com
          server_port: 587
          secure: true
          username: github_actions_yahoo_2
          password: ughb gllc mdlg zydq
          subject: Price Target Report
          to: ${{ secrets.EMAIL_TO }}
          from: GitHub Actions Workflow <chn.avraham@gmail.com>
          body: |
            The price target workflow ran successfully.
            Repository: ${{ github.repository }}
            Commit: ${{ github.sha }}

